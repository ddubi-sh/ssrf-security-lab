# LinkLens 로컬 실습 전용 구성
#
# 안전 규칙
#  - 호스트에 공개되는 서비스는 linklens 웹앱 하나뿐이며, 127.0.0.1 에만 바인딩합니다.
#  - content-service 와 monitor-service 에는 ports 설정이 없습니다(호스트에서 접근 불가).
#  - privileged, host network, docker socket 마운트를 사용하지 않습니다.
#  - 두 내부 서비스는 모두 컨테이너 내부 8000 포트를 씁니다(컨테이너마다 독립).

services:
  linklens:
    build: ./vulnerable-app
    container_name: linklens-web
    # 127.0.0.1 로만 공개합니다. 같은 네트워크의 다른 PC에서는 접근할 수 없습니다.
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - linklens-net
    depends_on:
      content-service:
        condition: service_healthy
      monitor-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  content-service:
    build: ./safe-service
    container_name: linklens-content
    # ports 설정 없음 : 호스트에서 직접 접근할 수 없고, Docker 네트워크 안에서만 접근합니다.
    networks:
      - linklens-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  monitor-service:
    build: ./internal-service
    container_name: linklens-monitor
    # ports 설정 없음 : 호스트에서 직접 접근할 수 없고, Docker 네트워크 안에서만 접근합니다.
    networks:
      - linklens-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  linklens-net:
    driver: bridge
