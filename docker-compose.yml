# SSRF Security Lab - 로컬 실습 전용 구성
#
# 안전 규칙
#  - 호스트에 공개되는 서비스는 vulnerable-app 하나뿐이며, 127.0.0.1 에만 바인딩합니다.
#  - safe-service 와 internal-service 에는 ports 설정이 없습니다(호스트에서 접근 불가).
#  - privileged, host network, docker socket 마운트를 사용하지 않습니다.

services:
  vulnerable-app:
    build: ./vulnerable-app
    container_name: ssrf-lab-vulnerable-app
    # 127.0.0.1 로만 공개합니다. 같은 네트워크의 다른 PC에서는 접근할 수 없습니다.
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - ssrf-lab-net
    depends_on:
      safe-service:
        condition: service_healthy
      internal-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  safe-service:
    build: ./safe-service
    container_name: ssrf-lab-safe-service
    # ports 설정 없음 : 호스트에서 직접 접근할 수 없고, Docker 네트워크 안에서만 접근합니다.
    # 접근 주소 -> http://safe-service:8000/public
    networks:
      - ssrf-lab-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  internal-service:
    build: ./internal-service
    container_name: ssrf-lab-internal-service
    # ports 설정 없음 : 브라우저로 직접 접근할 수 없습니다.
    # 접근 주소 -> http://internal-service:8001/admin  (SSRF 공격 목표)
    networks:
      - ssrf-lab-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  ssrf-lab-net:
    driver: bridge
